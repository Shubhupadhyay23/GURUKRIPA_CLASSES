app = "gurukripa-classes"
primary_region = "iad"

[build]
builder = "dockerfile"

[env]
PORT = "8080"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1

[[services]]
protocol = "tcp"
internal_port = 8080

  [services.http_checks]
  enabled = true
  interval = 10000
  timeout = 5000
  grace_period = "5s"
  method = "get"
  path = "/"
